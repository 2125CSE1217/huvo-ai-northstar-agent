<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northstar Homes — Ananya</title>
<style>
  :root{
    --bg:#0F1B2D;
    --panel:#16243A;
    --panel-2:#1C2E48;
    --gold:#D4A94F;
    --gold-dim:#9C7F3E;
    --text:#F2EFE9;
    --muted:#93A1B8;
    --agent-bubble:#1F3350;
    --user-bubble:#2A2010;
    --user-border:#5C4A22;
    --danger:#C2694B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1px 1px at 20% 15%, rgba(212,169,79,0.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 65% 8%, rgba(242,239,233,0.25) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 82% 22%, rgba(212,169,79,0.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 4%, rgba(242,239,233,0.2) 50%, transparent 51%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    height:min(760px, 92vh);
    background:var(--panel);
    border-radius:18px;
    border:1px solid rgba(212,169,79,0.18);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  header{
    padding:22px 24px 18px;
    border-bottom:1px solid rgba(242,239,233,0.08);
    display:flex;
    align-items:center;
    gap:14px;
    background:linear-gradient(180deg, rgba(212,169,79,0.07), transparent);
  }
  .star{
    width:34px;height:34px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  header h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  header p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--muted);
  }
  .thread{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .agent{
    align-self:flex-start;
    background:var(--agent-bubble);
    border-bottom-left-radius:4px;
  }
  .user{
    align-self:flex-end;
    background:var(--user-bubble);
    border:1px solid var(--user-border);
    border-bottom-right-radius:4px;
  }
  .typing{
    align-self:flex-start;
    color:var(--muted);
    font-size:13px;
    padding:2px 14px;
  }
  form{
    display:flex;
    gap:10px;
    padding:16px;
    border-top:1px solid rgba(242,239,233,0.08);
  }
  input[type=text]{
    flex:1;
    background:var(--panel-2);
    border:1px solid rgba(242,239,233,0.12);
    border-radius:10px;
    padding:11px 13px;
    color:var(--text);
    font-size:14.5px;
    outline:none;
  }
  input[type=text]:focus{
    border-color:var(--gold-dim);
  }
  button{
    border:none;
    border-radius:10px;
    padding:0 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .send{
    background:var(--gold);
    color:#1A1405;
  }
  .send:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
  .end-row{
    padding:0 16px 16px;
    display:flex;
    justify-content:center;
  }
  .end-btn{
    background:transparent;
    border:1px solid rgba(242,239,233,0.16);
    color:var(--muted);
    padding:8px 14px;
    font-size:12.5px;
  }
  .end-btn:hover{
    border-color:var(--gold-dim);
    color:var(--text);
  }
  .analytics{
    padding:18px;
    border-top:1px solid rgba(242,239,233,0.08);
    background:var(--panel-2);
    font-size:13px;
    max-height:280px;
    overflow-y:auto;
    display:none;
  }
  .analytics.show{display:block;}
  .analytics h2{
    font-size:13px;
    text-transform:none;
    color:var(--gold);
    margin:0 0 10px;
    font-weight:600;
  }
  .arow{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:5px 0;
    border-bottom:1px dashed rgba(242,239,233,0.08);
  }
  .arow .k{color:var(--muted);}
  .arow .v{text-align:right;max-width:60%;}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="star">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <path d="M13 1 L15.3 10.7 L25 13 L15.3 15.3 L13 25 L10.7 15.3 L1 13 L10.7 10.7 Z" fill="#D4A94F"/>
        </svg>
      </div>
      <div>
        <h1>Northstar Homes</h1>
        <p>Ananya · AI Sales Assistant · Northstar One, Sector 79, Gurugram</p>
      </div>
    </header>

    <div class="thread" id="thread"></div>

    <form id="chatForm">
      <input type="text" id="messageInput" placeholder="Type in English, Hindi, or Hinglish…" autocomplete="off" />
      <button type="submit" class="send" id="sendBtn">Send</button>
    </form>
    <div class="end-row">
      <button class="end-btn" id="endBtn">End conversation &amp; view analytics</button>
    </div>
    <div class="analytics" id="analytics"></div>
  </div>

<script>
  const thread = document.getElementById('thread');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const endBtn = document.getElementById('endBtn');
  const analyticsPanel = document.getElementById('analytics');

  let sessionId = null;

  function addBubble(role, text){
    const div = document.createElement('div');
    div.className = 'bubble ' + (role === 'user' ? 'user' : 'agent');
    div.textContent = text;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }

  function setTyping(on){
    let el = document.getElementById('typingIndicator');
    if(on){
      if(!el){
        el = document.createElement('div');
        el.id = 'typingIndicator';
        el.className = 'typing';
        el.textContent = 'Ananya is typing…';
        thread.appendChild(el);
        thread.scrollTop = thread.scrollHeight;
      }
    } else if(el){
      el.remove();
    }
  }

  // Greet locally so the customer sees an opener without spending a turn.
  addBubble('agent', "Hi! I'm Ananya from Northstar Homes. I help buyers with Northstar One, our 2 & 3 BHK project in Sector 79, Gurugram. What are you looking for — for yourself, or as an investment?");

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    addBubble('user', text);
    input.value = '';
    sendBtn.disabled = true;
    setTyping(true);
    try{
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sessionId, message: text})
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({detail:'Something went wrong.'}));
        throw new Error(err.detail || 'Request failed');
      }
      const data = await res.json();
      sessionId = data.session_id;
      setTyping(false);
      addBubble('agent', data.reply);
    }catch(err){
      setTyping(false);
      addBubble('agent', "Sorry, I'm having a connection issue on my end. Could you try again in a moment?");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
      input.focus();
    }
  });

  endBtn.addEventListener('click', async () => {
    if(!sessionId){
      alert('Start the conversation first.');
      return;
    }
    endBtn.disabled = true;
    endBtn.textContent = 'Generating analytics…';
    try{
      const res = await fetch('/api/end', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sessionId})
      });
      const data = await res.json();
      renderAnalytics(data.analytics);
    }catch(err){
      console.error(err);
    }finally{
      endBtn.disabled = false;
      endBtn.textContent = 'End conversation & view analytics';
    }
  });

  function renderAnalytics(a){
    analyticsPanel.innerHTML = '';
    const h = document.createElement('h2');
    h.textContent = 'Conversation Analytics';
    analyticsPanel.appendChild(h);
    Object.entries(a).forEach(([k,v]) => {
      const row = document.createElement('div');
      row.className = 'arow';
      const kEl = document.createElement('div');
      kEl.className = 'k';
      kEl.textContent = k;
      const vEl = document.createElement('div');
      vEl.className = 'v';
      vEl.textContent = Array.isArray(v) ? (v.length ? v.join(', ') : '—') : (v === null || v === undefined ? '—' : String(v));
      row.appendChild(kEl);
      row.appendChild(vEl);
      analyticsPanel.appendChild(row);
    });
    analyticsPanel.classList.add('show');
    analyticsPanel.scrollIntoView({behavior:'smooth', block:'end'});
  }
</script>
</body>
</html>
